<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="घराचे बांधकाम - घर बांधकाम खर्चाचा सोपा आणि स्मार्ट हिशोब" />
    <title>घर | खर्च</title>
    <!-- Apply the saved language to <html lang> before the app loads. The app then keeps the title/description in step with the selected language. -->
    <script>
      try {
        if (localStorage.getItem("homebuild_lang") === "en") document.documentElement.lang = "en";
      } catch (e) {}
    </script>
    <!-- Google Fonts: Noto Sans Devanagari & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-slate-900 selection:text-white font-sans min-h-screen">
    <div id="root">
      <!-- Splash shown until the app starts (React replaces it) -->
      <style>
        html, body { margin: 0; }
        @keyframes hb-spin { to { transform: rotate(360deg); } }
        @keyframes hb-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
        @keyframes hb-enter { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      </style>
      <div style="position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:#f8fafc">
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;animation:hb-enter .4s cubic-bezier(.22,1,.36,1) both">
          <span style="position:absolute;inset:0;border-radius:50%;border:3px solid #e2e8f0"></span>
          <span style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(245,158,11,0) 0%,#f59e0b 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:hb-spin 1.1s linear infinite"></span>
          <img src="/favicon-192.png" alt="" width="64" height="64" style="border-radius:16px;animation:hb-breathe 2.2s ease-in-out infinite" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
